<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2e9">
    <meta name="description" content="A little page with a warm hello for Alex.">
    <title>Hello Alex</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <span class="wordmark">a little hello<span aria-hidden="true"> ✳</span></span>
        <span class="edition">just for you</span>
      </header>
      <main>
        <section class="greeting" aria-labelledby="greeting-title">
          <p class="eyebrow"><span aria-hidden="true"></span> GOOD TO SEE YOU HERE</p>
          <h1 id="greeting-title">hello <span>alex<span class="period">.</span></span></h1>
          <p class="message">A small corner of the internet.<br>A big, warm welcome.</p>
          <canvas class="scene" aria-hidden="true"></canvas>
        </section>
      </main>
      <footer>
        <span>A simple greeting. A lovely beginning.</span>
        <span class="footer-mark" aria-hidden="true">↗</span>
      </footer>
    </div>
    <script type="module" src="animation.js"></script>
  </body>
</html>
